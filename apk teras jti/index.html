<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Teras JTI</title>
</head>
<body>

    <!-- Identitas aplikasi (logo + nama + tagline) -->
    <header>
        <p><strong>JTI</strong></p>
        <h1>Teras JTI</h1>
        <p>Reservasi tempat Jurusan Teknologi Informasi</p>
    </header>

    <main>
        <!-- Formulir login (struktur saja, belum ada proses autentikasi) -->
        <section>
            <h2>Masuk ke Akun</h2>
            <p>Masukkan email dan kata sandi untuk mulai memesan tempat.</p>

            <form action="dashboard.html">
                <p>
                    <label for="email">Email</label><br>
                    <input type="email" id="email" placeholder="contoh@email.com">
                </p>

                <p>
                    <label for="sandi">Kata Sandi</label><br>
                    <input type="password" id="sandi" placeholder="Masukkan kata sandi">
                </p>

                <p>
                    <button type="submit">Masuk</button>
                </p>
            </form>

            <p>Belum punya akun? <a href="daftar.html">Daftar</a></p>
        </section>
    </main>

    <footer>
        <p> 2026 Teras JTI - Politeknik Negeri Jember</p>
    </footer>

</body>
</html>
