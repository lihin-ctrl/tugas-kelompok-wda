<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Teras JTI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login">

    <header>
        <p class="logo">JTI</p>
        <h1>Teras JTI</h1>
        <p>Reservasi tempat Jurusan Teknologi Informasi</p>
    </header>

    <main>
        <section>
            <h2 class="sr-only">Masuk ke Akun</h2>

            <form action="dashboard.html">
                <p>
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="contoh@email.com">
                </p>
                <p>
                    <label for="sandi">Kata Sandi</label>
                    <input type="password" id="sandi" placeholder="Masukkan kata sandi">
                </p>
                <p>
                    <button type="submit">Masuk</button>
                </p>
            </form>

            <p>Belum punya akun? <a href="daftar.html">Daftar</a></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Teras JTI - Politeknik Negeri Jember</p>
    </footer>

</body>
</html>
